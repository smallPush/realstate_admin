services:
  app:
    image: ${APP_IMAGE:-realstate-admin:latest}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # These should be overridden by Dokploy's environment variables
      DATABASE_URL: ${DATABASE_URL:?Error DATABASE_URL is required}
      APP_SECRET: ${APP_SECRET:?Error APP_SECRET is required}
      VAPI_API_KEY: ${VAPI_API_KEY:-}
      CADDY_GLOBAL_OPTIONS: "local_certs"
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2019/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw

volumes:
  database_data:
